name: Build — Linux (x86_64 + aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── x86_64 builds ───────────────────────────────────────────────
  linux-x86_64:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: release
            type: Release
            flags: >-
              -DGGML_NATIVE=OFF
              -DGGML_CPU_ALL_VARIANTS=ON
              -DGGML_BACKEND_DL=ON
              -DGGML_LLAMAFILE=ON
          - build: debug-sanitizers
            type: Debug
            flags: >-
              -DGGML_NATIVE=OFF
              -DLLAMA_SANITIZE_ADDRESS=ON
              -DLLAMA_SANITIZE_UNDEFINED=ON
          - build: release-no-shared
            type: Release
            flags: >-
              -DGGML_NATIVE=OFF
              -DBUILD_SHARED_LIBS=OFF

    name: x86_64 (${{ matrix.build }})
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
            ${{ matrix.flags }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        if: matrix.build == 'release'
        run: cd build && ctest --output-on-failure --timeout 120 -j$(nproc)

      - name: Upload binaries
        if: matrix.build == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: llama-linux-x86_64
          path: build/bin/*
          retention-days: 7

  # ─── aarch64 cross-compile ───────────────────────────────────────
  linux-aarch64:
    runs-on: ubuntu-22.04
    name: aarch64 (cross-compile)
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_LLAMAFILE=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-linux-aarch64
          path: build/bin/*
          retention-days: 7
