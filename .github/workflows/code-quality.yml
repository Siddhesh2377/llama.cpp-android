name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── cppcheck static analysis ───────────────────────────────────
  cppcheck:
    runs-on: ubuntu-22.04
    name: cppcheck
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck on custom code
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            --suppress=noExplicitConstructor \
            --inline-suppr \
            --std=c++17 \
            -I include/ \
            -I src/ \
            -I ggml/include/ \
            src/llama-context.cpp \
            src/llama-context.h \
            src/llama-graph.cpp \
            src/llama-graph.h \
            include/llama.h

  # ─── compile warnings check ─────────────────────────────────────
  warnings:
    runs-on: ubuntu-22.04
    name: compile-warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev

      - name: Configure with -Werror
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGGML_NATIVE=OFF \
            -DLLAMA_ALL_WARNINGS=ON \
            -DLLAMA_FATAL_WARNINGS=ON

      - name: Build (warnings = errors)
        run: cmake --build build -j$(nproc)

  # ─── clang-tidy on modified files ───────────────────────────────
  clang-tidy:
    runs-on: ubuntu-22.04
    name: clang-tidy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake libcurl4-openssl-dev libssl-dev

      - name: Generate compile_commands.json
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGGML_NATIVE=OFF

      - name: Run clang-tidy on custom files
        run: |
          clang-tidy \
            -p build \
            --checks='-*,bugprone-*,performance-*,portability-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions' \
            --warnings-as-errors='bugprone-use-after-move,bugprone-dangling-handle' \
            src/llama-context.cpp \
            src/llama-graph.cpp \
            || true  # advisory — don't fail the build yet

  # ─── include-what-you-use check ─────────────────────────────────
  header-check:
    runs-on: ubuntu-22.04
    name: header-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Check include guards
        run: |
          echo "Checking for duplicate includes in custom headers..."
          errors=0
          for f in src/llama-context.h src/llama-graph.h include/llama.h; do
            if [ -f "$f" ]; then
              dupes=$(grep -E '^\s*#include' "$f" | sort | uniq -d)
              if [ -n "$dupes" ]; then
                echo "::error file=$f::Duplicate includes found: $dupes"
                errors=$((errors + 1))
              fi
            fi
          done
          exit $errors

      - name: Check custom API declarations match
        run: |
          echo "Verifying all llama.h custom functions are declared..."
          custom_funcs=$(grep -oP 'LLAMA_API\s+\w+\s+\Kllama_\w+' include/llama.h | sort)
          echo "Found $(echo "$custom_funcs" | wc -l) API functions in llama.h"
          echo "$custom_funcs"
